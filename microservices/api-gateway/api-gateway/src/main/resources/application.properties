spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=event-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${EVENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/events/**

spring.cloud.gateway.server.webmvc.routes[1].id=ticket-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${TICKET_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/tickets/**

spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${PAYMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[3].id=favorite-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${FAVORITE_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/favorites/**

spring.cloud.gateway.server.webmvc.routes[4].id=user-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${USER_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/users/**

management.endpoints.web.exposure.include=health,info